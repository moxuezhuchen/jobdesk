name: ConfFlow Compatibility Matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  producer-matrix:
    name: JobDesk with ConfFlow ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: stable
            version: 1.5.0
            wheel_sha256: d9ac87410f1b73b91e19eb740298431663ee5f07bd4ffaeb19779c3a53c2e8dc
          - label: next
            version: 1.5.1
            wheel_sha256: 5b3dc930acbf7df25ef298301c928051116c760658f9de95db0c3a5eff199008
    steps:
      - name: Check out JobDesk
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JobDesk test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download and verify the exact producer wheel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/confflow-dist"
          gh release download "v${{ matrix.version }}" \
            --repo moxuezhuchen/ConfFlow \
            --pattern "confflow-${{ matrix.version }}-py3-none-any.whl" \
            --dir "$RUNNER_TEMP/confflow-dist"
          wheel="$RUNNER_TEMP/confflow-dist/confflow-${{ matrix.version }}-py3-none-any.whl"
          test -f "$wheel"
          test "$(sha256sum "$wheel" | awk '{print $1}')" = "${{ matrix.wheel_sha256 }}"
          python -m pip install --no-deps "$wheel"

      - name: Verify capability contract
        env:
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          from jobdesk_app.core.confflow_preflight import (
              parse_confflow_capabilities,
              validate_confflow_capabilities,
          )

          raw = subprocess.check_output(["confflow", "--capabilities", "--json"], text=True)
          capabilities = parse_confflow_capabilities(raw)
          validate_confflow_capabilities(capabilities, require_dag=False)
          expected = os.environ["EXPECTED_VERSION"]
          if capabilities.version != expected:
              raise AssertionError(
                  f"capability version {capabilities.version!r} != wheel version {expected!r}"
              )
          print(json.dumps({"version": capabilities.version, "wire_contract": "accepted"}))
          PY

      - name: Run protocol and facade contract tests
        run: |
          python -m pytest -q \
            tests/test_confflow_preflight.py \
            tests/test_confflow_results.py \
            tests/test_confflow_control_backend.py \
            tests/test_confflow_launcher_integration.py
