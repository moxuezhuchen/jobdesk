name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check .

  type-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check out ConfFlow v2.0.0
        uses: actions/checkout@v4
        with:
          repository: moxuezhuchen/ConfFlow
          ref: v2.0.0
          path: .ci/confflow
          fetch-depth: 1

      - name: Install released ConfFlow v2.0.0 wheel
        shell: pwsh
        run: |
          gh release download v2.0.0 --repo moxuezhuchen/ConfFlow --pattern "confflow-2.0.0-py3-none-any.whl" --dir .ci\confflow-dist
          $wheel = Get-ChildItem -LiteralPath .ci\confflow-dist -Filter "confflow-2.0.0-*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "ConfFlow v2.0.0 release wheel was not downloaded." }
          if ((Get-FileHash -Algorithm SHA256 $wheel.FullName).Hash.ToLower() -ne "04ea51666d4c12538c14f2e47eb3000148bbb666ca401318edd87f301a636e3f") { throw "ConfFlow release wheel digest mismatch." }
          python -m pip install --no-deps $wheel.FullName
          python -c "import confflow; assert confflow.__version__ == '2.0.0'; print(confflow.__version__)"

      - name: MyPy type check
        run: python -m mypy src

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build package
        run: python -m build

  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      JOBDESK_REQUIRE_CONFFLOW_DIFFERENTIAL: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Check out ConfFlow v2.0.0
        uses: actions/checkout@v4
        with:
          repository: moxuezhuchen/ConfFlow
          ref: v2.0.0
          path: .ci/confflow
          fetch-depth: 1

      - name: Install released ConfFlow v2.0.0 wheel
        shell: pwsh
        run: |
          gh release download v2.0.0 --repo moxuezhuchen/ConfFlow --pattern "confflow-2.0.0-py3-none-any.whl" --dir .ci\confflow-dist
          $wheel = Get-ChildItem -LiteralPath .ci\confflow-dist -Filter "confflow-2.0.0-*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "ConfFlow v2.0.0 release wheel was not downloaded." }
          if ((Get-FileHash -Algorithm SHA256 $wheel.FullName).Hash.ToLower() -ne "04ea51666d4c12538c14f2e47eb3000148bbb666ca401318edd87f301a636e3f") { throw "ConfFlow release wheel digest mismatch." }
          python -m pip install --no-deps $wheel.FullName
          python -c "import confflow; assert confflow.__version__ == '2.0.0'; print(confflow.__version__)"

      - name: Verify ConfFlow wheel build provenance
        shell: pwsh
        env:
          JOBDESK_CONFFLOW_WHEEL_DIR: .ci/confflow-dist
          JOBDESK_CONFFLOW_CHECKOUT_DIR: .ci/confflow
        run: python -m pytest tests/test_confflow_wheel_build.py -v

      - name: Install ripgrep
        shell: pwsh
        run: choco install ripgrep -y --no-progress

      - name: Public-tree guard
        shell: pwsh
        run: powershell -File scripts/check_public_tree.ps1

      - name: Test with coverage
        run: python -m pytest tests/ -v --ignore=tests/integration --basetemp ${{ runner.temp }}\jobdesk_pytest --cov=jobdesk_app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml
