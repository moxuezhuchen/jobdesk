name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.5"

      - name: Verify checked-in dependency locks
        shell: pwsh
        run: powershell -File scripts/compile_dev_locks.ps1 -Check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/locks/jobdesk-dev-py311-win_amd64.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Ruff check
        run: python -m ruff check .

      - name: Black check for changed Python files
        env:
          BLACK_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_changed_black.py --no-include-working-tree

  type-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/locks/jobdesk-dev-py311-win_amd64.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Check out ConfFlow v2.1.3
        uses: actions/checkout@v4
        with:
          repository: moxuezhuchen/ConfFlow
          ref: v2.1.3
          path: .ci/confflow
          fetch-depth: 1

      - name: Install released ConfFlow v2.1.3 wheel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.1.3 --repo moxuezhuchen/ConfFlow --pattern "confflow-2.1.3-py3-none-any.whl" --dir .ci\confflow-dist
          $wheel = Get-ChildItem -LiteralPath .ci\confflow-dist -Filter "confflow-2.1.3-*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "ConfFlow v2.1.3 release wheel was not downloaded." }
          if ((Get-FileHash -Algorithm SHA256 $wheel.FullName).Hash.ToLower() -ne "10dab012cc8dafea9de2279bddfea3e978807cb0d526111dbe5eaee26cf542fe") { throw "ConfFlow release wheel digest mismatch." }
          python -m pip install --no-deps $wheel.FullName
          python -c "import confflow; assert confflow.__version__ == '2.1.3'; print(confflow.__version__)"

      - name: MyPy type check
        run: python -m mypy src

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/locks/jobdesk-dev-py311-win_amd64.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Build package
        run: python -m build --no-isolation

  base-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify base install does not require ConfFlow
        shell: pwsh
        run: |
          python -m venv .ci\base-install
          .ci\base-install\Scripts\python -m pip install --require-hashes -r requirements/locks/jobdesk-dev-py311-win_amd64.txt
          .ci\base-install\Scripts\python -m pip install --no-build-isolation --no-deps .
          Push-Location $env:RUNNER_TEMP
          try {
            & "${{ github.workspace }}\.ci\base-install\Scripts\python" -c "import importlib.util; assert importlib.util.find_spec('confflow') is None; from jobdesk_app.core.workflow_document import WorkflowDocument; assert WorkflowDocument.from_mapping({'global': {}, 'steps': []}).to_mapping() == {'global': {}, 'steps': []}"
          } finally {
            Pop-Location
          }

  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      JOBDESK_REQUIRE_CONFFLOW_DIFFERENTIAL: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lock: requirements/locks/jobdesk-dev-py311-win_amd64.txt
          - python-version: "3.12"
            lock: requirements/locks/jobdesk-dev-py312-win_amd64.txt
          - python-version: "3.13"
            lock: requirements/locks/jobdesk-dev-py313-win_amd64.txt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --require-hashes -r "${{ matrix.lock }}"
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Check out ConfFlow v2.1.3
        uses: actions/checkout@v4
        with:
          repository: moxuezhuchen/ConfFlow
          ref: v2.1.3
          path: .ci/confflow
          fetch-depth: 1

      - name: Install released ConfFlow v2.1.3 wheel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.1.3 --repo moxuezhuchen/ConfFlow --pattern "confflow-2.1.3-py3-none-any.whl" --dir .ci\confflow-dist
          $wheel = Get-ChildItem -LiteralPath .ci\confflow-dist -Filter "confflow-2.1.3-*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "ConfFlow v2.1.3 release wheel was not downloaded." }
          if ((Get-FileHash -Algorithm SHA256 $wheel.FullName).Hash.ToLower() -ne "10dab012cc8dafea9de2279bddfea3e978807cb0d526111dbe5eaee26cf542fe") { throw "ConfFlow release wheel digest mismatch." }
          python -m pip install --no-deps $wheel.FullName
          python -c "import confflow; assert confflow.__version__ == '2.1.3'; print(confflow.__version__)"

      - name: Verify ConfFlow wheel build provenance
        shell: pwsh
        env:
          JOBDESK_CONFFLOW_WHEEL_DIR: .ci/confflow-dist
          JOBDESK_CONFFLOW_CHECKOUT_DIR: .ci/confflow
        run: python -m pytest tests/test_confflow_wheel_build.py -v

      - name: Install ripgrep
        shell: pwsh
        run: choco install ripgrep -y --no-progress

      - name: Public-tree guard
        shell: pwsh
        run: powershell -File scripts/check_public_tree.ps1

      - name: Test with coverage
        run: python -m pytest tests/ -v --ignore=tests/integration --basetemp ${{ runner.temp }}\jobdesk_pytest --cov=jobdesk_app --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml
