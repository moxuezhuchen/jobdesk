name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check .

  type-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check out ConfFlow v2.1.2
        uses: actions/checkout@v4
        with:
          repository: moxuezhuchen/ConfFlow
          ref: v2.1.2
          path: .ci/confflow
          fetch-depth: 1

      - name: Install released ConfFlow v2.1.2 wheel
        shell: pwsh
        run: |
          $dist = ".ci\confflow-dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $wheel = Join-Path $dist "confflow-2.1.2-py3-none-any.whl"
          curl.exe --fail --location --retry 3 --retry-delay 2 --output $wheel "https://github.com/moxuezhuchen/ConfFlow/releases/download/v2.1.2/confflow-2.1.2-py3-none-any.whl"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $wheel)) { throw "ConfFlow v2.1.2 release wheel was not downloaded." }
          if ((Get-FileHash -Algorithm SHA256 $wheel).Hash.ToLower() -ne "80abfa69a7f865539eadfba5c628eeb95953164098f0fd462e0a00c7904e4f92") { throw "ConfFlow release wheel digest mismatch." }
          python -m pip install --no-deps $wheel
          python -c "import confflow; assert confflow.__version__ == '2.1.2'; print(confflow.__version__)"

      - name: MyPy type check
        run: python -m mypy src

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build package
        run: python -m build

  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      JOBDESK_REQUIRE_CONFFLOW_DIFFERENTIAL: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Check out ConfFlow v2.1.2
        uses: actions/checkout@v4
        with:
          repository: moxuezhuchen/ConfFlow
          ref: v2.1.2
          path: .ci/confflow
          fetch-depth: 1

      - name: Install released ConfFlow v2.1.2 wheel
        shell: pwsh
        run: |
          $dist = ".ci\confflow-dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $wheel = Join-Path $dist "confflow-2.1.2-py3-none-any.whl"
          curl.exe --fail --location --retry 3 --retry-delay 2 --output $wheel "https://github.com/moxuezhuchen/ConfFlow/releases/download/v2.1.2/confflow-2.1.2-py3-none-any.whl"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $wheel)) { throw "ConfFlow v2.1.2 release wheel was not downloaded." }
          if ((Get-FileHash -Algorithm SHA256 $wheel).Hash.ToLower() -ne "80abfa69a7f865539eadfba5c628eeb95953164098f0fd462e0a00c7904e4f92") { throw "ConfFlow release wheel digest mismatch." }
          python -m pip install --no-deps $wheel
          python -c "import confflow; assert confflow.__version__ == '2.1.2'; print(confflow.__version__)"

      - name: Verify ConfFlow wheel build provenance
        shell: pwsh
        env:
          JOBDESK_CONFFLOW_WHEEL_DIR: .ci/confflow-dist
          JOBDESK_CONFFLOW_CHECKOUT_DIR: .ci/confflow
        run: python -m pytest tests/test_confflow_wheel_build.py -v

      - name: Install ripgrep
        shell: pwsh
        run: choco install ripgrep -y --no-progress

      - name: Public-tree guard
        shell: pwsh
        run: powershell -File scripts/check_public_tree.ps1

      - name: Test with coverage
        run: python -m pytest tests/ -v --ignore=tests/integration --basetemp ${{ runner.temp }}\jobdesk_pytest --cov=jobdesk_app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml
